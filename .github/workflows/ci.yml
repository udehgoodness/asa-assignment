name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit==1.9.4

      - name: Run bandit (full report, all severities)
        run: bandit -r app/ -f json -o sast.bandit.json || true

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast.bandit.json
          path: sast.bandit.json

      # All previously-flagged findings (SQL injection, hardcoded secrets)
      # were fixed in Task 3 — this currently passes with zero medium/high
      # findings. See docs/findings.md VT-02/VT-03.
      - name: Fail on medium or high severity findings
        run: bandit -r app/ --severity-level medium

  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Run pip-audit
        run: pip-audit -r requirements.txt -f json -o sca.pip-audit.json || true

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca.pip-audit.json
          path: sca.pip-audit.json

      # Deliberately not gated: pip-audit's JSON has no reliable
      # severity/CVSS field to filter on programmatically, and the known
      # findings (docs/findings.md VT-06/VT-11/VT-12) are a documented,
      # conscious deferral with compensating controls already in place
      # (see docs/remediation-plan.md) — gating on "any finding" would
      # fail this build for a decision that's already been made.

  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vulntracker-api:ci .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: vulntracker-api:ci
          format: json
          output: container.trivy.json
          # Report-only, same reasoning as sca: known OS-package CVEs are
          # documented (docs/findings.md VT-15) with a deliberate deferral
          # — remediation is a recurring base-image refresh cadence, not a
          # one-time code fix — see docs/remediation-plan.md.

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container.trivy.json
          path: container.trivy.json

  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: helm/vulntracker
          format: json
          output: iac.trivy.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

      # The one Medium finding (VT-16, mutable image.tag) was fixed
      # alongside this branch's work — currently passes clean. Upload runs
      # regardless of the scan step's outcome so the report is always
      # available.
      - name: Upload IaC scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac.trivy.json
          path: iac.trivy.json
