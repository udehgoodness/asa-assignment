{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vulntracker.fullname" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vulntracker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller may reach this pod directly.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespaceLabel }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS resolution only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The notify service, and nothing else outbound.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.notifySelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.notifyPort }}
{{- end }}
